<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>声音驾驶舱</title>
  <link rel="stylesheet" href="style.css?v=40">
</head>
<body>
  <header class="app-header">
    <div>
      <h1>NOVA声音驾校</h1>
      <p class="app-subtitle">专业纠正跑调 五音不全救星</p>
    </div>
  </header>

  <div class="course-bar" id="course-bar">
    <div class="course-progress">
      <div class="course-progress-track">
        <div class="course-progress-fill" id="course-progress-fill"></div>
      </div>
      <span class="course-progress-text" id="course-progress-text">第 1 关 / 共 5 关</span>
    </div>
    <div class="course-steps-list" id="course-steps-list"></div>
    <h2 class="course-step-title" id="course-step-title">第 1 关：听觉训练</h2>
    <p class="course-step-desc" id="course-step-desc">先学会听出两个音的差别</p>
  </div>

  <main class="dashboard">
    <div id="feedback-bar" class="feedback-bar" hidden></div>
    <canvas id="canvas" width="800" height="400"></canvas>

    <!-- 听觉训练面板（独立于 canvas） -->
    <div id="ear-training-panel" class="ear-training-panel" hidden>
      <div class="et-progress">
        <span>等级 <strong id="et-level">1</strong></span>
        <span>题目 <strong id="et-question">1</strong>/10</span>
        <span>正确率 <strong id="et-accuracy">—</strong></span>
      </div>
      <div class="et-instruction" id="et-instruction">点击「开始」启动听觉训练</div>
      <div class="et-play-buttons">
        <button id="et-play-a" class="et-play-btn" disabled>▶ 听音 A</button>
        <button id="et-play-b" class="et-play-btn" disabled>▶ 听音 B</button>
      </div>
      <div class="et-answer-buttons">
        <button id="et-answer-same" class="et-answer-btn" disabled>相同</button>
        <button id="et-answer-diff" class="et-answer-btn" disabled>不同</button>
      </div>
      <div class="et-feedback" id="et-feedback"></div>
    </div>

    <div class="readout">
      <span class="readout-item">当前音: <strong id="current-note">—</strong></span>
      <span class="readout-item" id="mode-readout">—</span>
    </div>
    <div class="level-meter">
      <span>音量:</span>
      <div class="level-bar"><div id="level-fill"></div></div>
    </div>

    <aside class="tuner" id="tuner">
      <div class="tuner-note" id="tuner-note">—</div>
      <div class="tuner-gauge">
        <div class="tuner-scale">
          <span>-50</span>
          <span>-20</span>
          <span>0</span>
          <span>+20</span>
          <span>+50</span>
        </div>
        <div class="tuner-track">
          <div class="tuner-needle" id="tuner-needle"></div>
          <div class="tuner-center"></div>
        </div>
        <div class="tuner-cents" id="tuner-cents">0 cents</div>
      </div>
    </aside>
  </main>

  <footer class="controls">
    <button id="primary-btn" class="primary">▶ 开始</button>
    <button id="secondary-btn" class="secondary" hidden>停止</button>
    <button class="stats-btn" id="stats-btn" title="查看成绩统计">📊</button>
  </footer>

  <div class="stats-modal" id="stats-modal" hidden>
    <div class="stats-modal-content">
      <h2>练习统计</h2>
      <div id="stats-content"></div>
      <div class="stats-actions">
        <button id="stats-export" class="secondary">导出数据</button>
        <button id="stats-import" class="secondary">导入数据</button>
        <input type="file" id="stats-import-file" accept=".json,application/json" hidden>
        <button id="stats-reset" class="secondary">重置数据</button>
        <button id="stats-close" class="primary">关闭</button>
      </div>
    </div>
  </div>

  <div id="error-banner" class="error-banner" hidden></div>

  <!-- 使用指引弹窗（打开页面即显示） -->
  <div class="guide-modal" id="guide-modal">
    <div class="guide-card">
      <img class="guide-avatar" src="assets/principal.png" alt="李校长头像">
      <h2>开始前，请先戴上耳机</h2>
      <p>建议佩戴<b>带麦克风的耳机</b>：耳机让参考音听得更准，麦克风让音高识别更灵敏，纠音效果最好。</p>
      <p class="guide-tip">本课程共 5 关，通过一关会自动解锁下一关。</p>
      <button id="guide-start-btn" class="primary">知道了，开始</button>
    </div>
  </div>

  <script src="vendor/pitchy.min.js"></script>
  <script type="module" src="app.js?v=40"></script>
</body>
</html>
